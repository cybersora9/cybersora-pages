# Wydanie cybersora.pl (SZYBKOŚĆ S5, krok 9).
# Repo trzyma czytelne źródło; przy każdym pushu na master ten workflow buduje kopię
# ze zminifikowanym JS/CSS/HTML (.github/buduj/buduj.mjs) i to ją serwuje GitHub Pages.
# Powrót do starego trybu (Pages wprost z master): Settings → Pages → Source: Deploy from a branch.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --prefix .github/buduj
      - run: node .github/buduj/buduj.mjs . _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
